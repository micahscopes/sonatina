[package]
name = "sonatina-codegen"
version = "0.0.3-alpha"
edition.workspace = true
authors = ["Sonatina Developers"]
license = "Apache-2.0"
readme = "../../README.md"
homepage = "https://github.com/fe-lang/sonatina/tree/main/crates/codegen"
repository = "https://github.com/fe-lang/sonatina"
description = "High-performance code generator for smart contract"
categories = ["compilers", "wasm"]
keywords = ["compiler", "evm", "wasm", "smart-contract"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cranelift-entity = "0.136.1"
cranelift-codegen = { git = "https://github.com/fe-lang/wasmtime", rev = "29e29784e9b6363675513398a606bcc5bdad41fe", default-features = false, features = ["std", "unwind", "host-arch"], optional = true }
cranelift-frontend = { git = "https://github.com/fe-lang/wasmtime", rev = "29e29784e9b6363675513398a606bcc5bdad41fe", optional = true }
cranelift-module = { git = "https://github.com/fe-lang/wasmtime", rev = "29e29784e9b6363675513398a606bcc5bdad41fe", optional = true }
cranelift-native = { git = "https://github.com/fe-lang/wasmtime", rev = "29e29784e9b6363675513398a606bcc5bdad41fe", optional = true }
cranelift-object = { git = "https://github.com/fe-lang/wasmtime", rev = "29e29784e9b6363675513398a606bcc5bdad41fe", optional = true }
cranelift-jit = { git = "https://github.com/fe-lang/wasmtime", rev = "29e29784e9b6363675513398a606bcc5bdad41fe", optional = true }
smallvec = "1.15.1"
rustc-hash = "2.0.0"
rpds = "1.2.1"
sonatina-ir = { path = "../ir", version = "0.0.3-alpha" }
sonatina-triple = { path = "../triple", version = "0.0.3-alpha" }
sonatina-macros = { path = "../macros", version = "0.0.3-alpha" }
sonatina-verifier = { path = "../verifier", version = "0.0.3-alpha" }
dashmap = { version = "6.1", features = ["rayon"] }
rayon = { version = "1" }
bit-set = "0.8.0"
indexmap = { version = "2.12" }
tracing = "0.1"
vec-collections = { version = "0.4.3", default-features = false }

wasm-encoder = { version = "0.227", optional = true }
rspirv = { version = "0.13.0", optional = true }
spirv = { version = "0.4.0", optional = true }
waffle = { version = "0.2", optional = true }
naga = { version = "29", features = ["spv-out", "wgsl-out"], optional = true }

[dev-dependencies]
# The spirv tests reparse the emitted WGSL with naga's `wgsl-in` frontend and
# validate it under the browser capability set. `wgsl-in` is test-only, so it
# lives here and does not widen the library's naga features.
naga = { version = "29", features = ["wgsl-in"] }
hex = "0.4.3"
insta = "1.43"
dir-test = "0.4"
derive_more = { version = "1", default-features = false, features = ["full"] }
revm = { version = "18.0.0", default-features = false, features = ["std"] }
sonatina-parser = { path = "../parser", version = "0.0.3-alpha" }
object = { version = "0.39.1", default-features = false, features = ["read", "std"] }
tempfile = "3.23"

wasmtime = "44.0.1"
wasmparser = "0.248.0"
wgpu = { version = "29", features = ["vulkan-portability"] }
pollster = "0.4.0"

[features]
cranelift = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-module",
    "dep:cranelift-native",
    "dep:cranelift-object",
]
cranelift-jit = ["cranelift", "dep:cranelift-jit"]
sp1 = ["cranelift", "cranelift-codegen/riscv64"]

wasm = ["dep:waffle", "dep:wasm-encoder"]
spirv-backend = ["dep:naga"]

[[test]]
name = "cranelift_sp1"
required-features = ["sp1"]

[[test]]
name = "cranelift_object"
required-features = ["cranelift"]

[[test]]
name = "cranelift_jit"
required-features = ["cranelift-jit"]

[[test]]
name = "cranelift_backend"
required-features = ["cranelift", "wasm", "spirv-backend"]

[[test]]
name = "wasm_backend"
required-features = ["cranelift", "wasm"]

[[test]]
name = "wasm_numeric_f32"
required-features = ["cranelift", "wasm"]

[[test]]
name = "spirv_backend"
required-features = ["cranelift", "wasm", "spirv-backend"]

[[test]]
name = "mandelbrot_snapshot"
required-features = ["cranelift", "wasm", "spirv-backend"]

[[test]]
name = "mandelbrot_relay_render"
required-features = ["cranelift", "wasm"]
